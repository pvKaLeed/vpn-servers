name: Update VPN Servers

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "scripts/update_servers.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: vpn-server-update
  cancel-in-progress: true

jobs:
  update:
    name: Update VPN Gate Servers
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ======================================================
      # UPDATE VPN SERVERS
      # ======================================================

      - name: Update VPN servers
        env:
          VPN_FETCH_TIMEOUT: "30"
          VPN_MAX_SERVERS: "0"
          VPN_MIN_SCORE: "0"
          VPN_MAX_PING: "0"
        run: |
          set -e

          echo "========================================"
          echo "RUNNING VPN SERVER UPDATER"
          echo "========================================"

          python --version

          python scripts/update_servers.py

          echo ""
          echo "Updater finished successfully."

      # ======================================================
      # VERIFY JSON FILE
      # ======================================================

      - name: Verify servers.json
        shell: bash
        run: |
          set -e

          FILE="servers/servers.json"

          echo "Checking: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: servers.json does not exist."
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "ERROR: servers.json is empty."
            exit 1
          fi

          echo ""
          echo "File size:"
          wc -c "$FILE"

          echo ""
          echo "First 10 lines:"
          sed -n '1,10p' "$FILE"

      # ======================================================
      # VALIDATE JSON
      # ======================================================

      - name: Validate JSON
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("servers/servers.json")

          print("Validating:", path)

          try:
              with path.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:
                  data = json.load(f)

          except Exception as exc:
              print("")
              print("========================================")
              print("JSON VALIDATION FAILED")
              print("========================================")
              print("Error:", repr(exc))
              print("")

              print("Raw beginning of file:")
              print("----------------------------------------")

              raw = path.read_bytes()

              print(
                  raw[:2000].decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              print("----------------------------------------")

              sys.exit(1)

          if not isinstance(data, dict):
              print("ERROR: JSON root must be an object.")
              sys.exit(1)

          if "schemaVersion" not in data:
              print("ERROR: Missing schemaVersion.")
              sys.exit(1)

          if "generatedAt" not in data:
              print("ERROR: Missing generatedAt.")
              sys.exit(1)

          if "servers" not in data:
              print("ERROR: Missing servers.")
              sys.exit(1)

          if not isinstance(data["servers"], list):
              print("ERROR: servers must be an array.")
              sys.exit(1)

          print("")
          print("JSON validation successful.")
          print("Schema:", data["schemaVersion"])
          print("Generated:", data["generatedAt"])
          print("Servers:", len(data["servers"]))
          PY

      # ======================================================
      # VALIDATE OVPN FILES
      # ======================================================

      - name: Validate OpenVPN files
        shell: bash
        run: |
          set -e

          if [ ! -d "servers/ovpn" ]; then
            echo "ERROR: servers/ovpn does not exist."
            exit 1
          fi

          COUNT=$(
            find servers/ovpn \
              -type f \
              -name "*.ovpn" \
              | wc -l
          )

          echo "OVPN files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No OVPN files generated."
            exit 1
          fi

          FAILED=0

          while IFS= read -r file; do

            echo "Checking: $file"

            if [ ! -s "$file" ]; then
              echo "ERROR: Empty OVPN file: $file"
              FAILED=1
              continue
            fi

            if ! grep -qiE \
              '(^|[[:space:]])client([[:space:]]|$)' \
              "$file"; then

              echo "ERROR: Missing client directive: $file"
              FAILED=1
            fi

            if ! grep -qiE \
              '(^|[[:space:]])remote([[:space:]]|$)' \
              "$file"; then

              echo "ERROR: Missing remote directive: $file"
              FAILED=1
            fi

          done < <(
            find servers/ovpn \
              -type f \
              -name "*.ovpn"
          )

          if [ "$FAILED" -ne 0 ]; then
            echo "OVPN validation failed."
            exit 1
          fi

          echo ""
          echo "All OVPN files passed validation."

      # ======================================================
      # UPDATE SUMMARY
      # ======================================================

      - name: Update summary
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("servers/servers.json")

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          servers = data["servers"]

          print("")
          print("========================================")
          print("VPN SERVER UPDATE SUMMARY")
          print("========================================")

          print(
              "Generated:",
              data.get("generatedAt")
          )

          print(
              "Servers:",
              len(servers)
          )

          print("")
          print("Top 10:")

          for server in servers[:10]:

              print(
                  f"{server.get('countryCode', '??'):>3} | "
                  f"{server.get('hostname', ''):<35} | "
                  f"score={server.get('score', 0)} | "
                  f"ping={server.get('pingMs')}"
              )

          print("========================================")
          PY

      # ======================================================
      # CHECK GIT CHANGES
      # ======================================================

      - name: Check changes
        id: git_changes
        shell: bash
        run: |
          set -e

          git add servers/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No server data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Server data changes detected."
          fi

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit updated servers
        if: steps.git_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "chore: update VPN Gate servers"

      # ======================================================
      # PUSH
      # ======================================================

      - name: Push update
        if: steps.git_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git push
